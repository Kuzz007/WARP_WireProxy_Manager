name: Signed release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign, and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Verify tag name
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(awk -F'"' '/^VERSION=/{print $2; exit}' warpwp.sh)"
          [[ "v$version" == "$GITHUB_REF_NAME" ]]

      - name: Install pinned ShellCheck
        run: |
          version="$(tr -d '[:space:]' < .shellcheck-version)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck

      - name: Run project checks
        run: bash scripts/check.sh

      - name: Prepare signed assets
        env:
          WARPWP_RELEASE_SIGNING_KEY: ${{ secrets.WARPWP_RELEASE_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$WARPWP_RELEASE_SIGNING_KEY" ]] || { echo 'WARPWP_RELEASE_SIGNING_KEY is not configured.' >&2; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/warpwp-release-signing-key"
          printf '%s\n' "$WARPWP_RELEASE_SIGNING_KEY" | tr -d '\r' > "$key_file"
          mkdir release-assets
          install -m 0755 warpwp.sh release-assets/warpwp.sh
          install -m 0755 warp-wireproxy-native.sh release-assets/warp-wireproxy-native.sh
          install -m 0755 install-warp-check.sh release-assets/install-warp-check.sh
          install -m 0755 warp-wireproxy-auto.sh release-assets/warp-wireproxy-auto.sh
          install -m 0644 release-signing.pub release-assets/release-signing.pub
          (
            cd release-assets
            sha256sum warpwp.sh warp-wireproxy-native.sh install-warp-check.sh warp-wireproxy-auto.sh release-signing.pub > SHA256SUMS
          )
          ssh-keygen -Y sign -f "$key_file" -n warpwp-release release-assets/SHA256SUMS
          rm -f -- "$key_file"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WARP WireProxy Manager $GITHUB_REF_NAME" \
            --generate-notes
