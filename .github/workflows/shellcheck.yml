name: Shellcheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  bash-check:
    name: Bash syntax and shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Версия закреплена в .shellcheck-version и ставится из релизов koalaman.
      # Версия из apt дрейфует вместе с образом раннера, из-за чего локальная
      # проверка и CI расходились в наборе правил.
      - name: Install pinned shellcheck
        run: |
          version="$(tr -d '[:space:]' < .shellcheck-version)"
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run project checks
        run: |
          chmod +x scripts/check.sh
          scripts/check.sh
